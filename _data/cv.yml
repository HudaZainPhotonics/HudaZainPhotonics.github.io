cv:
  name: Huda Adnan Zain
  label: Experimental Photonics Researcher and Educator
  email: huda.zain(at)kfupm.edu.sa
  location: Dhahran, Saudi Arabia
  image: ""
  summary: Experimental photonics researcher and educator focused on building and validating fiber-optic and plasmonic sensing systems at the device and system levels. My work integrates fiber Bragg gratings, distributed acoustic sensing, and nanomaterial-functionalized microresonators with machine-learning-assisted interrogation for energy, biomedical, and environmental applications.

