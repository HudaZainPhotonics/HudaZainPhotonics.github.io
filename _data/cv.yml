      - company: King Fahd University of Petroleum and Minerals (KFUPM)
        position: Postdoctoral Fellow
        location: Dhahran, Saudi Arabia
        start_date: 2025
        end_date: Present
        highlights:
          - Led the design and experimental validation of fiber-optic sensing systems, including FBG and distributed acoustic sensing platforms, with machine-learning-based signal interpretation.
          - Led a successfully funded internal grant project, from proposal development and equipment selection through experimental execution, data analysis, publications, and patent-related activities.
          - Initiated and contributed to joint projects with KFUPM research centers, including the Center for Integrative Petroleum Research and the Center for Aviation and Space Exploration.
          - Supervised and mentored graduate and undergraduate researchers and contributed to STEM research outreach for high-school students.

      - company: Universitas Airlangga
        position: APD Postdoctoral Fellow
        location: Indonesia
        start_date: 2024
        end_date: 2025
        highlights:
          - Developed and experimentally validated Au-graphene plasmonic sensing platforms under international collaborative grants.
          - Coordinated cross-institutional experimental workflows and data exchange across Malaysian-Indonesian research teams.

      - company: University of Malaya
