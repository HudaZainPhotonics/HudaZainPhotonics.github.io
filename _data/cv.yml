        location: Kuala Lumpur, Malaysia
        start_date: 2020
        end_date: 2022
        highlights:
          - Authored a successful industry-funded proposal for the Petronas PRSB-UiTM Collaborative Research Project.
          - Designed, fabricated, and experimentally characterized ZnO-, graphene-, and polymer-coated fiber sensors.

